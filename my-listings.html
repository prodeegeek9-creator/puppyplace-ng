<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>My listings | PuppyPlace</title>
<link rel="canonical" href="https://puppyplace.ng/my-listings.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--orange:#ed6436;--orange-d:#c9530a;--black:#0e0e0c;--gray:#6b6b6b;--light:#f1f3f5;--border:#e9ecef;--green:#1e9e57;--red:#d63c2f;--amber:#8a5a00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:#f8f9fa;color:#1a1a18;min-height:100vh}
a{color:inherit}
.top{background:#1a1a18;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:18px;text-decoration:none}.logo span{color:var(--orange)}
.top-r{display:flex;gap:10px;align-items:center;font-size:13px}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;font-weight:900;margin-bottom:6px}
.sub{color:var(--gray);font-size:14px;line-height:1.6;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.login{max-width:420px;margin:40px auto}
label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font:600 15px 'Nunito',sans-serif;color:var(--black);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{resize:vertical;min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--orange);color:#fff;border:0;border-radius:50px;padding:13px 22px;font:800 14px 'Nunito',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--orange-d)}.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--black);border:1.5px solid var(--border)}.btn.ghost:hover{border-color:var(--orange);color:var(--orange)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.full{width:100%;margin-top:18px}
.link{background:none;border:0;color:var(--orange);font:800 13px 'Nunito',sans-serif;cursor:pointer;padding:0}
.msg{font-size:13px;font-weight:700;margin-top:12px;line-height:1.5}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.list{display:grid;gap:14px}
.pet{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.pet img{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--light)}
.pet-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.pet-t{font-size:17px;font-weight:900}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:50px;text-transform:uppercase;letter-spacing:.04em}
.b-live{background:rgba(30,158,87,.12);color:var(--green)}.b-wait{background:rgba(243,156,18,.15);color:var(--amber)}.b-no{background:rgba(214,60,47,.1);color:var(--red)}.b-sold{background:#6b7280;color:#fff}
.pet.sold img{filter:grayscale(1);opacity:.6}
.pet-m{font-size:14px;color:var(--gray);line-height:1.6}
.pet-n{font-size:13px;font-weight:700;margin-top:6px;line-height:1.5}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--gray)}
.stats b{color:var(--black);font-weight:900}.stats small{font-size:12px}.stats a{color:inherit;text-decoration:none}.stats a b{color:var(--orange)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{text-align:center;padding:40px 20px;color:var(--gray);line-height:1.7}
.bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;overflow-y:auto;padding:16px;align-items:flex-start;justify-content:center}
.modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:560px;margin:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.x{background:var(--light);border:0;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-weight:700;font-size:14px}
.checks label{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;margin:0}
.checks input{width:18px;height:18px;accent-color:var(--orange)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--light)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.ph .ctl{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.ph .ctl button{background:rgba(255,255,255,.92);border:0;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px}
.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--border);border-radius:10px;aspect-ratio:1;cursor:pointer;color:var(--gray);font-weight:800;font-size:13px;text-align:center}
.note{background:rgba(243,156,18,.1);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin:10px 0}
@media(max-width:480px){.top-r>span{display:none}}
.top-r .btn{white-space:nowrap}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.pet{grid-template-columns:72px 1fr}.pet img{width:72px;height:72px}}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/">Puppy<span>Place</span></a>
  <div class="top-r" id="topRight"></div>
</div>

<div class="wrap" id="app">
  <div class="empty">Loading…</div>
</div>

<div class="bg" id="editBg"><div class="modal" id="editModal"></div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
const app = $('#app');
let me = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', headers: opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Something went wrong. Try again.'); e.status = res.status; throw e; }
  return data;
}

/* ── LOG IN ── */
function showLogin(step = 'phone', phone = '') {
  $('#topRight').innerHTML = '';
  app.innerHTML = `<div class="card login">
    <h1>My listings</h1>
    <p class="sub">Log in with the WhatsApp number you listed with. We'll send you a 6-digit code on WhatsApp. No password needed.</p>
    ${step === 'phone' ? `
      <label for="ph">WhatsApp number</label>
      <input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="0803 123 4567" value="${esc(phone)}"/>
      <button class="btn full" id="go">Send me a code</button>` : `
      <p class="sub" style="margin:0">Code sent to <strong>${esc(phone)}</strong> on WhatsApp. <button class="link" id="back">Change number</button></p>
      <label for="code">6-digit code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"/>
      <button class="btn full" id="go">Log in</button>
      <p class="sub" style="margin:12px 0 0">Didn't get it? <button class="link" id="again">Send again</button></p>`}
    <div class="msg" id="msg"></div>
    <p class="sub" style="margin:18px 0 0">Not listed yet? <a href="/sell-my-dog.html" style="color:var(--orange);font-weight:800">List a pet for free</a></p>
  </div>`;
  const msg = $('#msg'), go = $('#go');
  const fail = (e) => { msg.className = 'msg err'; msg.textContent = e.message; go.disabled = false; };
  if (step === 'phone') {
    const send = async () => {
      const p = $('#ph').value.trim();
      if (!p) return fail(new Error('Enter your WhatsApp number.'));
      go.disabled = true; msg.textContent = '';
      try { await api('/api/auth/code', { method: 'POST', body: JSON.stringify({ phone: p }) }); showLogin('code', p); }
      catch (e) { fail(e); }
    };
    go.onclick = send; $('#ph').onkeydown = (e) => e.key === 'Enter' && send(); $('#ph').focus();
  } else {
    const verify = async () => {
      const c = $('#code').value.replace(/\D/g, '');
      if (c.length !== 6) return fail(new Error('Enter the 6-digit code.'));
      go.disabled = true; msg.textContent = '';
      try { await api('/api/auth/verify', { method: 'POST', body: JSON.stringify({ phone, code: c }) }); load(); }
      catch (e) { fail(e); }
    };
    go.onclick = verify; $('#code').oninput = (e) => e.target.value.replace(/\D/g, '').length === 6 && verify(); $('#code').focus();
    $('#back').onclick = () => showLogin('phone', phone);
    $('#again').onclick = async () => {
      try { await api('/api/auth/code', { method: 'POST', body: JSON.stringify({ phone }) }); msg.className = 'msg ok'; msg.textContent = 'A new code is on its way.'; }
      catch (e) { fail(e); }
    };
  }
}

// Tells the message icon on other pages that this browser is signed in.
const setIn = (on) => { try { on ? localStorage.setItem('pp_in', '1') : localStorage.removeItem('pp_in'); } catch { /* private mode */ } };

/* ── MY LISTINGS ── */
async function load() {
  try { me = await api('/api/me'); }
  catch (e) { if (e.status === 401) { setIn(false); return showLogin(); } app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  setIn(true);
  render();
  actFromLink();
}

// Arrived from a pet's page ("Edit listing", "Mark as sold"): do that, once.
function actFromLink() {
  const m = /^#(edit|sold|available)-(.+)$/.exec(location.hash);
  if (!m) return;
  history.replaceState(null, '', location.pathname);
  const id = decodeURIComponent(m[2]);
  if (!me.listings.some((p) => String(p.id) === id)) return;
  if (m[1] === 'edit') return openEdit(id);
  const btn = app.querySelector(`[data-sold="${CSS.escape(id)}"]`);
  if (btn) { btn.scrollIntoView({ block: 'center' }); markSold(id, m[1] === 'sold', btn); }
}

function photosOf(p) {
  return Array.isArray(p.image_urls) && p.image_urls.length ? p.image_urls.filter(Boolean) : p.image_url ? [p.image_url] : [];
}
const latestEdit = (p) => (me.edits || []).find((e) => String(e.pet_id) === String(p.id));

function render() {
  $('#topRight').innerHTML = `<span>${esc(me.account.name || '+' + me.account.phone)}</span><a href="/messages.html" style="font-weight:800;text-decoration:none">Messages</a><button class="btn ghost small" id="out">Log out</button>`;
  $('#out').onclick = async () => { await api('/api/auth/logout', { method: 'POST' }).catch(() => {}); setIn(false); showLogin(); };
  const L = me.listings || [];
  app.innerHTML = `<h1>My listings</h1>
    <p class="sub">Changes you make are checked by PuppyPlace before they show on the site, usually within a day. You'll get a WhatsApp message when they're approved.</p>
    ${L.length ? `<div class="list">${L.map(card).join('')}</div>` : `<div class="card empty">You have no listings on this number yet.<br/><a class="btn" style="margin-top:14px" href="/sell-my-dog.html">List a pet for free</a></div>`}`;
  app.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openEdit(b.dataset.edit)));
  app.querySelectorAll('[data-remove]').forEach((b) => (b.onclick = () => openRemove(b.dataset.remove)));
  app.querySelectorAll('[data-sold]').forEach((b) => (b.onclick = () => markSold(b.dataset.sold, b.dataset.to === 'sold', b)));
}

// Sold (or adopted): the listing stays up, stamped and greyed, for two months, then it is removed.
const SOLD_KEEP_DAYS = 60;
const soldLabel = (p) => (p.listing_type === 'adoption' ? 'adopted' : 'sold');
function goneOn(p) {
  const d = new Date(Date.parse(p.sold_at) + SOLD_KEEP_DAYS * 864e5);
  return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'long' });
}

async function markSold(id, sold, btn) {
  const p = me.listings.find((x) => String(x.id) === String(id));
  if (!p) return;
  const word = soldLabel(p);
  if (sold && !confirm(`Mark your ${p.breed || 'pet'} as ${word}?\n\nIt stays on PuppyPlace with a ${word.toUpperCase()} stamp for two months, so buyers can see it went, and buyers can no longer contact you about it. Then it is removed.`)) return;
  btn.disabled = true;
  try {
    await api('/api/me/sold', { method: 'POST', body: JSON.stringify({ pet_id: p.id, sold }) });
    await load();
    flash(sold ? `🎉 Marked as ${word}. Congratulations!` : '✅ Your listing is available again.');
  } catch (e) { btn.disabled = false; alert(e.message); }
}

// Views, WhatsApp chats and messages for a listing, when the site has them.
function statsLine(p) {
  const n = me.stats && me.stats[String(p.id)];
  if (!n || p.active === false) return '';
  const k = (v) => Number(v || 0).toLocaleString('en-NG');
  const bits = [
    `<span title="Times the listing's page was opened">👀 <b>${k(n.views)}</b> view${n.views == 1 ? '' : 's'}${n.views_week ? ` <small>(${k(n.views_week)} this week)</small>` : ''}</span>`,
    `<span title="Buyers who opened a WhatsApp chat with you">🟢 <b>${k(n.whatsapp)}</b> WhatsApp chat${n.whatsapp == 1 ? '' : 's'}</span>`,
    `<span title="Buyers who messaged you on PuppyPlace">✉️ ${n.messages ? `<a href="/messages.html"><b>${k(n.messages)}</b> message${n.messages == 1 ? '' : 's'}</a>` : '<b>0</b> messages'}</span>`,
  ];
  return `<div class="stats">${bits.join('')}</div>`;
}

function card(p) {
  const ph = photosOf(p)[0];
  const e = latestEdit(p);
  const status = p.active === false ? '<span class="badge b-wait">Waiting for approval</span>'
    : p.sold_at ? `<span class="badge b-sold">${soldLabel(p)}</span>` : '<span class="badge b-live">Live</span>';
  const soldNote = p.sold_at ? `<div class="pet-n" style="color:var(--gray)">Shown with a ${soldLabel(p).toUpperCase()} stamp until ${goneOn(p)}, then removed.</div>` : '';
  let req = '';
  if (e?.status === 'pending') req = `<div class="pet-n" style="color:var(--amber)">⏳ ${e.kind === 'remove' ? 'Take-down request' : 'Your changes'} waiting for review</div>`;
  else if (e?.status === 'rejected') req = `<div class="pet-n" style="color:var(--red)">Your last change wasn't approved${e.note ? `: ${esc(e.note)}` : ''}</div>`;
  else if (e?.status === 'approved') req = '<div class="pet-n" style="color:var(--green)">✅ Your last change was approved</div>';
  return `<div class="card pet${p.sold_at ? ' sold' : ''}">
    ${ph ? `<img src="${esc(ph)}" alt="" loading="lazy"/>` : '<img alt=""/>'}
    <div>
      <div class="pet-h"><span class="pet-t">${esc(p.breed || p.name || 'Pet')}</span>${status}</div>
      <div class="pet-m">${[p.age, p.listing_type === 'adoption' ? 'For adoption' : p.price ? money(p.price) : 'Price on request', p.location].filter(Boolean).map(esc).join(' · ')}<br/>${photosOf(p).length} photo${photosOf(p).length === 1 ? '' : 's'}</div>
      ${statsLine(p)}
      ${soldNote}
      ${req}
      <div class="acts">
        ${p.active !== false && p.slug ? `<a class="btn ghost small" href="/pets/${encodeURIComponent(p.slug)}" target="_blank" rel="noopener">View page</a>` : ''}
        ${p.active !== false && !p.sold_at ? `<button class="btn small" data-sold="${esc(p.id)}" data-to="sold">Mark as ${soldLabel(p)}</button>` : ''}
        ${p.sold_at ? `<button class="btn ghost small" data-sold="${esc(p.id)}" data-to="available">Mark as available again</button>` : ''}
        ${p.sold_at ? '' : `<button class="btn ${p.active !== false ? 'ghost ' : ''}small" data-edit="${esc(p.id)}">Edit</button>`}
        <button class="btn ghost small" data-remove="${esc(p.id)}">Take down</button>
      </div>
    </div>
  </div>`;
}

/* ── EDIT ── */
let editPhotos = [];
function openEdit(id) {
  const p = me.listings.find((x) => String(x.id) === String(id));
  if (!p) return;
  editPhotos = photosOf(p);
  const e = latestEdit(p);
  $('#editModal').innerHTML = `
    <div class="modal-h"><h1 style="font-size:20px">Edit ${esc(p.breed || 'listing')}</h1><button class="x" id="x">✕</button></div>
    <p class="sub" style="margin:0">Your changes are checked before they show on the site.</p>
    ${e?.status === 'pending' ? '<div class="note">You already have changes waiting for review. Sending these replaces them.</div>' : ''}
    <div class="grid2">
      <div><label>Breed</label><input id="f_breed" value="${esc(p.breed)}" maxlength="80"/></div>
      <div><label>Pet's name (optional)</label><input id="f_name" value="${esc(p.name)}" maxlength="60"/></div>
      <div><label>Age</label><input id="f_age" value="${esc(p.age)}" maxlength="40"/></div>
      <div><label>Location</label><input id="f_location" value="${esc(p.location)}" maxlength="80"/></div>
      <div><label>Selling or adoption</label><select id="f_type"><option value="sale"${p.listing_type !== 'adoption' ? ' selected' : ''}>For sale</option><option value="adoption"${p.listing_type === 'adoption' ? ' selected' : ''}>For adoption (free)</option></select></div>
      <div id="priceBox"><label>Price (₦)</label><input id="f_price" inputmode="numeric" value="${p.price ?? ''}"/></div>
      <div><label>Pedigree</label><select id="f_ped"><option value="">Not stated</option><option value="pedigree"${p.pedigree === 'pedigree' ? ' selected' : ''}>Pedigree</option><option value="non-pedigree"${p.pedigree === 'non-pedigree' ? ' selected' : ''}>Non-pedigree</option></select></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="f_vac"${p.vaccinated ? ' checked' : ''}/> Vaccinated</label>
      <label><input type="checkbox" id="f_dew"${p.dewormed ? ' checked' : ''}/> Dewormed</label>
    </div>
    <label>Description</label><textarea id="f_specs" maxlength="1500">${esc(p.specs)}</textarea>
    <label>Photos (the first is the main photo)</label>
    <div class="photos" id="photos"></div>
    <label>Note for PuppyPlace (optional)</label><input id="f_note" maxlength="300" placeholder="e.g. new photos, price reduced"/>
    <button class="btn full" id="send">Send for review</button>
    <div class="msg" id="emsg"></div>`;
  const tog = () => ($('#priceBox').style.display = $('#f_type').value === 'adoption' ? 'none' : '');
  $('#f_type').onchange = tog; tog();
  $('#x').onclick = closeEdit;
  drawPhotos();
  $('#send').onclick = () => sendEdit(p);
  $('#editBg').style.display = 'flex';
}
function closeEdit() { $('#editBg').style.display = 'none'; }
$('#editBg').addEventListener('click', (e) => { if (e.target.id === 'editBg') closeEdit(); });

function drawPhotos() {
  const box = $('#photos');
  box.innerHTML = editPhotos.map((u, i) => `<div class="ph"><img src="${esc(u)}" alt=""/>${i === 0 ? '<span class="tag">Main</span>' : ''}
    <div class="ctl">${i > 0 ? `<button title="Make main" data-first="${i}">★</button>` : ''}<button title="Remove" data-del="${i}">✕</button></div></div>`).join('') +
    (editPhotos.length < 6 ? '<label class="add">＋ Add photo<input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden id="addPh"/></label>' : '');
  box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => { editPhotos.splice(Number(b.dataset.del), 1); drawPhotos(); }));
  box.querySelectorAll('[data-first]').forEach((b) => (b.onclick = () => { const [x] = editPhotos.splice(Number(b.dataset.first), 1); editPhotos.unshift(x); drawPhotos(); }));
  const input = $('#addPh');
  if (input) input.onchange = async () => {
    const msg = $('#emsg');
    for (const f of [...input.files].slice(0, 6 - editPhotos.length)) {
      msg.className = 'msg'; msg.textContent = 'Uploading…';
      const fd = new FormData(); fd.append('file', f);
      try { const r = await api('/api/me/photo', { method: 'POST', body: fd }); editPhotos.push(r.url); msg.textContent = ''; }
      catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    }
    drawPhotos();
  };
}

async function sendEdit(p) {
  const msg = $('#emsg'), btn = $('#send');
  const type = $('#f_type').value;
  const changes = {
    breed: $('#f_breed').value, name: $('#f_name').value, age: $('#f_age').value, location: $('#f_location').value,
    listing_type: type, price: type === 'adoption' ? null : $('#f_price').value.replace(/[^\d]/g, '') || null,
    pedigree: $('#f_ped').value || null, vaccinated: $('#f_vac').checked, dewormed: $('#f_dew').checked,
    specs: $('#f_specs').value, image_urls: editPhotos,
  };
  btn.disabled = true; msg.textContent = '';
  try {
    await api('/api/me/edit', { method: 'POST', body: JSON.stringify({ pet_id: p.id, kind: 'edit', changes, note: $('#f_note').value }) });
    closeEdit(); await load();
    flash('✅ Sent for review. You will get a WhatsApp message when it is approved.');
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; btn.disabled = false; }
}

function openRemove(id) {
  const p = me.listings.find((x) => String(x.id) === String(id));
  if (!p) return;
  $('#editModal').innerHTML = `
    <div class="modal-h"><h1 style="font-size:20px">Take down ${esc(p.breed || 'listing')}?</h1><button class="x" id="x">✕</button></div>
    <p class="sub">PuppyPlace will remove the listing from the site once they've checked the request.${p.sold_at || p.active === false ? '' : ` Sold it? Use <b>Mark as ${soldLabel(p)}</b> instead: it shows a ${soldLabel(p).toUpperCase()} stamp straight away, with no wait.`}</p>
    <label>Why?</label>
    <select id="r_why"><option>No longer available</option><option>Sold</option><option>Adopted</option><option>Other</option></select>
    <button class="btn full" id="send">Ask to take it down</button>
    <div class="msg" id="emsg"></div>`;
  $('#x').onclick = closeEdit;
  $('#send').onclick = async () => {
    const msg = $('#emsg'), btn = $('#send');
    btn.disabled = true;
    try {
      await api('/api/me/edit', { method: 'POST', body: JSON.stringify({ pet_id: p.id, kind: 'remove', note: $('#r_why').value }) });
      closeEdit(); await load(); flash('✅ Request sent. The listing comes down once it is checked.');
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; btn.disabled = false; }
  };
  $('#editBg').style.display = 'flex';
}

function flash(text) {
  const d = document.createElement('div');
  d.className = 'card msg ok'; d.style.marginBottom = '14px'; d.textContent = text;
  app.prepend(d); setTimeout(() => d.remove(), 6000);
}

load();
</script>
</body>
</html>
